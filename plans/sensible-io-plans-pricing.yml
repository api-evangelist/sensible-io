description: >-
  Sensible offers three pricing tiers — Growth, Scale and Enterprise — each
  with a monthly document allotment plus per-document overage. Pricing is
  billed per-document (not per-page) so multi-page documents cost the same as
  single-page ones up to ~100 pages.
notes: >-
  Annual billing offers ~10% effective discount over monthly. Human review
  and document splitting are included only on Scale and Enterprise.
sources:
- https://www.sensible.so/pricing
