meters:
- name: plan_subscription
  description: Flat monthly tier fee.
  unit: month
  aggregation: sum
  dimensions:
  - account
  - tier
- name: documents_processed
  description: Documents extracted in the billing month.
  unit: document
  aggregation: sum
  dimensions:
  - account
  - environment
  - extractor
- name: document_overage
  description: Documents above the included monthly bundle.
  unit: document
  aggregation: sum
  dimensions:
  - account
- name: human_review_touches
  description: Manual review interactions (Scale/Enterprise).
  unit: review
  aggregation: sum
  dimensions:
  - account
  - reviewer
principles:
- name: Visibility
  description: Use the Sensible portal Usage page; export per-extractor / per-environment counts for chargeback.
- name: Allocation
  description: Use environments and extractor naming conventions to map to teams / cost centres.
- name: Optimization
  description: Right-size monthly bundle; consolidate similar templates; avoid unnecessary re-runs; switch to annual.
- name: Accountability
  description: Assign extractor owners; alert at 75% of monthly bundle.
