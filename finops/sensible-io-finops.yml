description: >-
  FOCUS-aligned FinOps profile for Sensible. Costs are a flat monthly tier fee
  (Growth $499 / Scale $1,499 / Enterprise custom) plus per-document overage
  ($0.50/document on Growth/Scale, tiered on Enterprise). Charge is per
  document — not per page — which makes long documents (up to ~100 pages)
  highly cost-efficient.
notes: >-
  Optimisation focuses on right-sizing the monthly bundle to actual document
  volume; switching to annual billing for ~10% effective discount; minimising
  human-review touches on Scale/Enterprise.
sources:
- https://www.sensible.so/pricing
