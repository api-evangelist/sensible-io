specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Sensible
providerId: sensible-io
created: '2026-05-08'
modified: '2026-05-08'
reconciled: false
tags:
- AI
- Document AI
- IDP
- Extraction
- Rate Limiting
- Quotas
- Throttling
description: >-
  Sensible's primary throttle is the per-plan monthly document allotment;
  documents above the bundle are billed at $0.50 per document overage on
  Growth/Scale tiers (Enterprise has tiered overage). API request-level
  numeric per-second limits are not publicly published.
notes: >-
  Processing latency is typically 6 seconds to 1 minute per document.
  Documents above ~100 pages may be priced separately under per-page
  contracts. Reconciled flagged false until per-second rate ceiling is
  publicly documented.
sources:
- https://docs.sensible.so/reference/api-overview
- https://www.sensible.so/pricing
responseCodes:
  throttled: 429
limits:
- name: REST API requests
  scope: api_token
  metric: requests
  limit: see Sensible docs
  notes: Per-token throttle; 429 with Retry-After.
- name: Growth plan documents/month
  scope: account
  metric: documents/month
  limit: 750
- name: Scale plan documents/month
  scope: account
  metric: documents/month
  limit: 3200
policies:
- name: Async Extraction
  description: Use async extraction endpoints for large portfolios; poll the document state until completion.
- name: Backoff Strategy
  description: Honor 429 with Retry-After; use exponential backoff with jitter.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
