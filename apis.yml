name: Sensible
kind: company
description: >-
  Sensible is a developer-focused document understanding platform that
  converts unstructured documents (PDFs, emails, images) into JSON. The core
  IP is SenseML — a document-specific query language combining LLM techniques
  with layout-based rules. The REST API exposes extract, classify, fill,
  generate and document-management endpoints, with SDKs for Node, Python and
  Go.
